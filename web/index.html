<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bashtion</title>
    <link rel="stylesheet" href="./vendor/xterm.css">
    <style>
      html, body { height: 100%; margin: 0; background: #111; }
      #terminal { height: 100%; }
      #status { color: #9a9a9a; font: 13px system-ui; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <div id="status">loading…</div>
    <div id="terminal"></div>
    <script src="./load-rom.js"></script>
    <script src="./load-kernel.js"></script>
    <script src="./load-rootfs.js"></script>
    <script src="./load-lab.js"></script>
    <script src="./vendor/xterm.js"></script>
    <script src="./vendor/xterm-pty.js"></script>
    <script src="./module.js"></script>
    <script type="module">
      import initQemu from './out.js';
      const status = (m) => document.getElementById('status').textContent = m;

      const xterm = new Terminal({ scrollback: 5000 });
      xterm.open(document.getElementById('terminal'));
      const { master, slave } = openpty();
      xterm.loadAddon(master);
      Module.pty = slave;
      Module.mainScriptUrlOrBlob = new URL('./out.js', location.href).href;

      status('starting VM (first boot is slow: interpreter, no JIT)…');
      const instance = await initQemu(Module);

      // xterm-pty poll fix, as proven in the ktock harness: report readiness
      // from the pty when it has no pending readable data.
      const oldPoll = Module.TTY.stream_ops.poll;
      const pty = Module.pty;
      Module.TTY.stream_ops.poll = function (stream, timeout) {
        if (!pty.readable) {
          return (pty.readable ? 1 : 0) | (pty.writable ? 4 : 0);
        }
        return oldPoll.call(stream, timeout);
      };
      status('running');
    </script>
  </body>
</html>
