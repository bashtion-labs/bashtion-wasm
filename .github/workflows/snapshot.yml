name: snapshot

# Pre-booted VM state for browser restore: builds the guest image, boots it on
# the runner's native qemu (8.2.x, machine-series-matched to the wasm engine's
# 8.2.0), captures a migration stream after the autologin shell appears, and
# publishes the matched {rootfs-booted.ext4, vdb.qcow2, vm.state} set.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['snapshot/**', 'image/**', '.github/workflows/snapshot.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build guest image
        run: make image

      # The migration stream must come from the same tree as the wasm engine:
      # a distro-8.2.2 stream hangs the fork engine's -incoming silently
      # (measured), and ktock's migration example captures with a native build
      # of the fork itself.
      - name: Build native qemu from the fork tree
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq             ninja-build libglib2.0-dev libpixman-1-dev libattr1-dev             libcap-ng-dev flex bison python3-venv zlib1g-dev
          git clone --depth 1 https://github.com/ktock/qemu-wasm.git forknative
          cd forknative && mkdir b && cd b
          ../configure --target-list=x86_64-softmmu --without-default-features             --enable-system --enable-virtfs --enable-attr --enable-cap-ng             --with-coroutine=ucontext
          make -j"$(nproc)" qemu-system-x86_64
          ./qemu-system-x86_64 --version | head -1

      - name: Capture pre-booted state
        run: QEMU_BIN="$PWD/forknative/b/qemu-system-x86_64" ./snapshot/make-snapshot.sh out/image out/snapshot

      - name: Boot log tail (evidence)
        if: always()
        run: tail -30 out/snapshot/boot-console.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-set
          path: |
            out/snapshot/rootfs-booted.ext4
            out/snapshot/vdb.qcow2
            out/snapshot/vm.state
            out/image/vmlinuz
            out/snapshot/boot-console.log
          retention-days: 14
