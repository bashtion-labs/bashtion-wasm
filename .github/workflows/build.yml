name: build

# Native x86_64 runners: the pinned emsdk 4.0.10 image is amd64-only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qemu-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # The toolchain stage builds zlib/glib/pixman/libffi under emscripten and
      # dominates build time; cache it in GHCR.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare patched toolchain Dockerfile
        run: |
          mkdir -p out/toolchain/tests/docker/dockerfiles
          cp third_party/qemu/tests/docker/dockerfiles/emsdk-wasm64-cross.docker \
             out/toolchain/tests/docker/dockerfiles/
          for p in patches/toolchain/*.patch; do
            echo "applying $p"
            patch -p1 -d out/toolchain < "$p"
          done

      - name: Build toolchain image
        uses: docker/build-push-action@v6
        with:
          context: out/toolchain
          file: out/toolchain/tests/docker/dockerfiles/emsdk-wasm64-cross.docker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/toolchain:qemu-v11.1.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Apply QEMU patches to a working copy
        run: |
          cp -R third_party/qemu out/qemu-src
          cd out/qemu-src
          for p in ../../patches/qemu/*.patch; do
            echo "applying $p"
            git apply "$p"
          done

      - name: Configure and build qemu-system-x86_64 (wasm64)
        run: |
          docker run --rm -d --name bashtion-build \
            -v "$PWD/out/qemu-src:/qemu/:ro" \
            ghcr.io/${{ github.repository }}/toolchain:qemu-v11.1.1 sleep infinity
          docker exec -w /build bashtion-build emconfigure /qemu/configure \
            --static --cpu=wasm64 --target-list=x86_64-softmmu \
            --cross-prefix= --without-default-features \
            --enable-system --with-coroutine=fiber --enable-virtfs
          docker exec -w /build bashtion-build emmake make -j"$(nproc)" qemu-system-x86_64
          mkdir -p out/htdocs
          docker cp bashtion-build:/build/qemu-system-x86_64 out/htdocs/out.js
          docker cp bashtion-build:/build/qemu-system-x86_64.wasm out/htdocs/ || true
          docker cp bashtion-build:/build/qemu-system-x86_64.worker.js out/htdocs/ || true
          docker rm -f bashtion-build

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-wasm64
          path: out/htdocs/
          retention-days: 14

