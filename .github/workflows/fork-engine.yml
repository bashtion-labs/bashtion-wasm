name: fork-engine

# Diagnostic comparison build: the ktock/qemu-wasm wasm32 engine (with its
# TB-to-wasm JIT) to drive the same guest image. Exists to discriminate
# between "our guest/image is broken" and "upstream wasm64 TCI is unfit":
# the fork demonstrably boots interactive guests in browsers.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fork-engine.yml', 'patches/fork/**']

permissions:
  contents: read

jobs:
  qemu-wasm32-fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone fork (shallow, pinned)
        run: |
          git clone --depth 1 https://github.com/ktock/qemu-wasm.git fork
          cd fork && git rev-parse HEAD
          # configure-era submodules; meson also git-inits wraps into the tree
          git submodule update --init --depth 1 || true

      - name: Patch fork toolchain (zlib.net URL rotted after 1.3.2 shipped)
        run: |
          sed -i 's|https://zlib.net/zlib-$ZLIB_VERSION.tar.xz|https://github.com/madler/zlib/releases/download/v$ZLIB_VERSION/zlib-$ZLIB_VERSION.tar.gz|' fork/Dockerfile
          sed -i 's|tar xJC /zlib|tar xzC /zlib|' fork/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Build fork toolchain (emsdk 3.1.50)
        uses: docker/build-push-action@v6
        with:
          context: fork
          file: fork/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: fork-toolchain:ci
          cache-from: type=gha,scope=fork
          cache-to: type=gha,mode=max,scope=fork

      - name: Build qemu-system-x86_64 (wasm32 + JIT), fork flags verbatim
        run: |
          # rw mount: meson writes wrap checkouts and mkvenv egg-info into the tree
          docker run --rm -d --name forkbuild -v "$PWD/fork:/qemu/" fork-toolchain:ci
          docker exec forkbuild git config --global --add safe.directory '*'
          EXTRA_CFLAGS="-O3 -g -Wno-error=unused-command-line-argument -matomics -mbulk-memory -DNDEBUG -DG_DISABLE_ASSERT -D_GNU_SOURCE -sASYNCIFY=1 -pthread -sPROXY_TO_PTHREAD=1 -sFORCE_FILESYSTEM -sALLOW_TABLE_GROWTH -sTOTAL_MEMORY=2300MB -sWASM_BIGINT -sMALLOC=mimalloc --js-library=/build/node_modules/xterm-pty/emscripten-pty.js -sEXPORT_ES6=1 -sASYNCIFY_IMPORTS=ffi_call_js"
          docker exec forkbuild emconfigure /qemu/configure --static --target-list=x86_64-softmmu --cpu=wasm32 --cross-prefix= \
            --without-default-features --enable-system --with-coroutine=fiber --enable-virtfs \
            --extra-cflags="$EXTRA_CFLAGS" --extra-cxxflags="$EXTRA_CFLAGS" \
            --extra-ldflags="-sEXPORTED_RUNTIME_METHODS=getTempRet0,setTempRet0,addFunction,removeFunction,TTY,FS"
          docker exec forkbuild emmake make -j"$(nproc)" qemu-system-x86_64
          mkdir -p out/fork
          docker exec forkbuild sh -c 'cd /build && tar cf - qemu-system-x86_64*' | tar xf - -C out/fork
          docker rm -f forkbuild

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-wasm32-fork
          path: out/fork/
          retention-days: 14
